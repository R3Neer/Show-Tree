name: Bootstrap vendored R3CLI

on:
  push:
    branches:
      - feature/ans-and-vendored-r3cli

permissions:
  contents: write

jobs:
  vendor:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Show-Tree
        uses: actions/checkout@v5
        with:
          path: Show-Tree

      - name: Check out R3CLI
        uses: actions/checkout@v5
        with:
          repository: R3Neer/R3CLI
          path: R3CLI

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Vendor R3CLI
        run: python Show-Tree/scripts/update_r3cli.py R3CLI

      - name: Commit generated dependency
        working-directory: Show-Tree
        shell: bash
        run: |
          if git diff --quiet -- vendor dependencies.json && [ -z "$(git status --porcelain --untracked-files=all -- vendor dependencies.json)" ]; then
            echo "Vendored dependency is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor dependencies.json
          git commit -m "Vendor R3CLI dependency"
          git push origin HEAD:${GITHUB_REF_NAME}
