name: Release 0.1.6

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-0.1.6.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'release: publish 0.1.6 hotfix'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '0.115.1'

      - name: Prepare 0.1.6 metadata and release notes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('src/nushell/show-tree.nu'): ("version: '0.1.5'", "version: '0.1.6'"),
              Path('src/nushell/show-tree-format.nu'): ("const PRODUCER_VERSION = '0.1.5'", "const PRODUCER_VERSION = '0.1.6'"),
              Path('src/powershell/Show-Tree.ps1'): ('Version = "0.1.5"', 'Version = "0.1.6"'),
              Path('README.md'): ('producer_version: 0.1.5', 'producer_version: 0.1.6'),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one {old!r}, found {count}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          cat > docs/releases/0.1.6.md <<'EOF'
          # Show-Tree 0.1.6

          Show-Tree 0.1.6 is a focused Nushell integration hotfix for child processes that reload the user configuration.

          ## Fixed

          - Fixes `show-tree-display.nu` failing with `Can't convert to boolean` when a child Nushell process inherits `SHOW_TREE_DISPLAY_HOOK_INSTALLED=true` from a parent process and then loads Show-Tree again through `config.nu`.
          - The display-hook marker is now considered active only when it is the boolean value `true` in the current Nushell process. An inherited environment-string value such as `"true"` is treated as stale process-local state, so the child installs its own display hook normally.
          - Adds a regression test that reproduces the parent-process to child-process inheritance case and verifies that the child can load the display module successfully.

          ## Why this matters

          Interactive use was generally unaffected because the marker remains a real boolean inside the process that installed the hook. The failure appeared in automation that launches a new Nushell process with `--config`, which is a legitimate way to load commands imported from `config.nu` such as Show-Tree.

          ## Compatibility

          - No command-line options change.
          - The public Nushell row contract is unchanged.
          - `.showtree` remains schema version 1; `producer_version` advances to 0.1.6.
          - PowerShell behavior is unchanged apart from reporting version 0.1.6 in help output.
          - This is a patch release over 0.1.5.

          ## Validation

          The fix is covered by a dedicated child-process regression test, and the existing Show-Tree CI suite passed before preparing this release. The release workflow also reruns the relevant Nushell syntax, rendering, traversal and structured-output checks against the 0.1.6 working tree before publishing.
          EOF

      - name: Validate hotfix working tree
        shell: bash
        run: |
          nu --no-config-file -c 'nu-check --as-module src/nushell/show-tree.nu | if not $in { exit 1 }'
          nu --no-config-file -c 'nu-check --as-module src/nushell/show-tree-display.nu | if not $in { exit 1 }'
          nu --no-config-file -c 'nu-check --as-module src/nushell/show-tree-format.nu | if not $in { exit 1 }'
          nu --no-config-file -c 'nu-check --as-module src/nushell/show-tree-save.nu | if not $in { exit 1 }'
          nu --no-config-file tests/Nushell.Rendering.nu
          nu --no-config-file tests/Nushell.DefaultComplete.nu
          nu --no-config-file tests/Nushell.Structured.nu

      - name: Commit release metadata
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md src/nushell/show-tree.nu src/nushell/show-tree-format.nu src/powershell/Show-Tree.ps1 docs/releases/0.1.6.md
          git commit -m 'chore: prepare 0.1.6 hotfix release'
          git push origin HEAD:main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build release archive
        shell: bash
        run: |
          git archive --format=zip --output Show-Tree-0.1.6.zip "$RELEASE_SHA"
          sha256sum Show-Tree-0.1.6.zip | tee Show-Tree-0.1.6.zip.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.1.6 \
            Show-Tree-0.1.6.zip#'Show-Tree 0.1.6 source package' \
            Show-Tree-0.1.6.zip.sha256#'SHA-256 checksum' \
            --target "$RELEASE_SHA" \
            --title 'Show-Tree 0.1.6 — Child-process hook hotfix' \
            --notes-file docs/releases/0.1.6.md

      - name: Remove temporary precheck branches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for branch in __release_precheck_tmp __release_precheck_tmp2 __release_precheck_tmp3 __release_precheck_tmp4 __release_precheck_tmp5; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null 2>&1 || true
          done
