name: Test

on:
  push:
  pull_request:

jobs:
  nushell-structured-output:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Show-Tree
        uses: actions/checkout@v5
        with:
          path: Show-Tree

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '0.115.1'

      - name: Syntax-check Nushell modules and installer
        run: |
          nu --no-config-file -c 'nu-check --as-module Show-Tree/src/nushell/show-tree.nu | if not $in { exit 1 }'
          nu --no-config-file -c 'nu-check --as-module Show-Tree/src/nushell/show-tree-display.nu | if not $in { exit 1 }'
          nu --no-config-file -c 'nu-check --as-module Show-Tree/src/nushell/show-tree-format.nu | if not $in { exit 1 }'
          nu --no-config-file -c 'nu-check --as-module Show-Tree/src/nushell/show-tree-save.nu | if not $in { exit 1 }'
          nu --no-config-file -c 'nu-check Show-Tree/install-show-tree.nu | if not $in { exit 1 }'

      - name: Test complete default traversal
        run: nu Show-Tree/tests/Nushell.DefaultComplete.nu

      - name: Test native pipeline output and showtree persistence
        run: nu Show-Tree/tests/Nushell.Structured.nu

      - name: Test raw and builtin showtree save contract
        run: nu Show-Tree/tests/Nushell.ShowtreeRaw.nu

      - name: Benchmark renderer scaling
        run: nu --no-config-file Show-Tree/tests/Nushell.Performance.nu

      - name: Test direct rendering path
        run: nu --no-config-file -c 'use Show-Tree/src/nushell/show-tree.nu [main]; show-tree Show-Tree -d 0 | ignore'

      - name: Test direct REPL result, ans and showtree reopening
        run: |
          python -m pip install pexpect
          python Show-Tree/tests/test_repl.py

  windows-installation:
    runs-on: windows-latest
    steps:
      - name: Check out Show-Tree
        uses: actions/checkout@v5
        with:
          path: Show-Tree

      - name: Set up Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '0.115.1'

      - name: Test Nushell Windows hidden attributes
        shell: pwsh
        run: nu Show-Tree/tests/Nushell.WindowsHidden.nu

      - name: Benchmark Nushell traversal
        shell: pwsh
        run: nu --no-config-file Show-Tree/tests/Nushell.TraversalPerformance.nu

      - name: Test complete default PowerShell traversal
        shell: pwsh
        run: ./Show-Tree/tests/PowerShell.DefaultComplete.ps1

      - name: Reject a corrupted vendored dependency
        shell: pwsh
        run: |
          $copy = Join-Path $env:RUNNER_TEMP 'Show-Tree-corrupt'
          Copy-Item -Recurse -Force ./Show-Tree $copy
          Add-Content -LiteralPath (Join-Path $copy 'vendor/R3CLI/powershell/resources.json') -Value ' '
          try {
              & (Join-Path $copy 'Install-ShowTree.ps1') -PowerShellOnly
              throw 'Corrupt dependency was unexpectedly accepted.'
          }
          catch {
              if ($_.Exception.Message -notmatch 'SHA256 verification') { throw }
          }

      - name: Seed a broken previous Show-Tree config block
        shell: pwsh
        run: |
          $nuConfig = (& nu --no-config-file -c 'print --no-newline $nu.config-path' | Out-String).Trim()
          New-Item -ItemType Directory -Path (Split-Path -Parent $nuConfig) -Force | Out-Null
          @'
          $env.SHOW_TREE_SENTINEL_BEFORE = 'before'
          # >>> Show-Tree >>>
          this old installer block is intentionally invalid [
          # <<< Show-Tree <<<
          $env.SHOW_TREE_SENTINEL_AFTER = 'after'
          '@ | Set-Content -LiteralPath $nuConfig -Encoding utf8NoBOM

          $nuPath = $nuConfig.Replace('\', '/')
          $checkCode = "if (open --raw '$nuPath' | nu-check) { exit 1 } else { exit 0 }"
          nu --no-config-file -c $checkCode

      - name: Repair and install through the Nushell installer
        shell: pwsh
        run: nu --no-config-file ./Show-Tree/install-show-tree.nu

      - name: Validate repaired config, persistence, backup and Nushell command
        shell: pwsh
        run: |
          $nuConfig = (& nu --no-config-file -c 'print --no-newline $nu.config-path' | Out-String).Trim()
          $text = Get-Content -LiteralPath $nuConfig -Raw
          if (($text | Select-String -Pattern '# >>> Show-Tree >>>' -AllMatches).Matches.Count -ne 1) { throw 'Expected one Show-Tree start marker.' }
          if (($text | Select-String -Pattern '# <<< Show-Tree <<<' -AllMatches).Matches.Count -ne 1) { throw 'Expected one Show-Tree end marker.' }
          if ($text.IndexOf('SHOW_TREE_SENTINEL_BEFORE') -gt $text.IndexOf('# >>> Show-Tree >>>')) { throw 'Installer moved the Show-Tree block ahead of preceding config.' }
          if ($text.IndexOf('SHOW_TREE_SENTINEL_AFTER') -lt $text.IndexOf('# <<< Show-Tree <<<')) { throw 'Installer moved the Show-Tree block behind following config.' }
          if ($text -notmatch 'src/nushell/show-tree\.nu') { throw 'Installer did not point at the organized Nushell source tree.' }
          if ($text -notmatch 'show-tree-format\.nu') { throw 'Installer did not import the .showtree format module.' }
          if ($text -notmatch "'to showtree'") { throw 'Installer did not import to showtree.' }
          if ($text -notmatch "'from showtree'") { throw 'Installer did not import from showtree.' }
          if ($text -notmatch "show-tree-save\.nu' save") { throw 'Installer did not import the tree-aware save wrapper.' }
          if ($text -match "show-tree-display\.nu' save") { throw 'Installer still imports the legacy display-module save wrapper.' }

          $backup = $nuConfig + '.show-tree.bak'
          if (-not (Test-Path -LiteralPath $backup)) { throw 'Nushell config backup was not created.' }
          if ((Get-Content -LiteralPath $backup -Raw) -notmatch 'intentionally invalid') { throw 'Backup does not contain the pre-repair config.' }

          $validationCode = @'
          if $env.SHOW_TREE_SENTINEL_BEFORE != 'before' or $env.SHOW_TREE_SENTINEL_AFTER != 'after' {
              error make { msg: 'surrounding config did not load' }
          }

          let installed_rows = (show-tree Show-Tree -d 1)
          if (($installed_rows | where type == file | is-empty)) { error make { msg: 'installed default Show-Tree still omitted files' } }

          let human = ($nu.temp-dir | path join 'show-tree-installed-save.txt')
          show-tree Show-Tree -d 1 | save --force $human
          let human_text = (open --raw $human | ansi strip)
          if not ($human_text | str contains 'SHOW-TREE') { error make { msg: 'installed save wrapper did not write the human tree' } }
          if not ($human_text | str contains 'Total size') { error make { msg: 'installed save wrapper lost the tree footer' } }
          if not ($human_text | str contains 'README.md') { error make { msg: 'installed human tree omitted files by default' } }
          if ($human_text | str contains 'Hidden entries are omitted') { error make { msg: 'installed human-tree save leaked the interactive hidden-entry reminder' } }

          let snapshot = ($nu.temp-dir | path join 'show-tree-installed.showtree')
          show-tree Show-Tree -d 1 | save --force $snapshot
          let raw_snapshot = (open --raw $snapshot)
          if not ($raw_snapshot | str contains 'schema_version') { error make { msg: 'installed .showtree snapshot is not versioned' } }
          if not ($raw_snapshot | str contains 'lineage') { error make { msg: 'installed .showtree snapshot lost lineage' } }
          let snapshot_meta = (open $snapshot | metadata)
          if (($snapshot_meta.show_tree_result? | default false) != true) { error make { msg: 'open .showtree did not restore Show-Tree metadata' } }
          if (($snapshot_meta.show_tree_render? | default [] | is-empty)) { error make { msg: 'open .showtree did not restore lineage metadata' } }

          rm --force $human
          rm --force $snapshot
          '@
          nu --config $nuConfig -c $validationCode

      - name: Install PowerShell integration
        shell: pwsh
        run: ./Show-Tree/Install-ShowTree.ps1 -PowerShellOnly

      - name: Validate PowerShell profile import and pipeline output
        shell: pwsh
        run: |
          pwsh -Command 'Show-Tree Show-Tree -MaxDepth 0'

          $saved = Join-Path $env:RUNNER_TEMP 'show-tree-powershell-pipe.txt'
          $env:SHOW_TREE_PIPE_TEST = $saved
          pwsh -Command 'Show-Tree Show-Tree -MaxDepth 1 | Set-Content -LiteralPath $env:SHOW_TREE_PIPE_TEST -Encoding utf8'

          if (-not (Test-Path -LiteralPath $saved)) { throw 'PowerShell pipeline did not create the output file.' }
          $savedText = Get-Content -LiteralPath $saved -Raw
          if ($savedText -notmatch 'SHOW-TREE') { throw 'PowerShell pipeline did not receive the tree banner.' }
          if ($savedText -notmatch 'Total size') { throw 'PowerShell pipeline did not receive the tree footer.' }
          if ($savedText -notmatch 'README\.md') { throw 'PowerShell pipeline output omitted files by default.' }
          if ($savedText -match 'Hidden entries are omitted') { throw 'PowerShell pipeline leaked the interactive hidden-entry reminder.' }
          if ($savedText.Contains([string][char]27)) { throw 'PowerShell pipeline output contains ANSI escape sequences.' }

      - name: Reinstall both integrations idempotently
        shell: pwsh
        run: |
          ./Show-Tree/Install-ShowTree.ps1
          $nuConfig = (& nu --no-config-file -c 'print --no-newline $nu.config-path' | Out-String).Trim()
          $text = Get-Content -LiteralPath $nuConfig -Raw
          if (($text | Select-String -Pattern '# >>> Show-Tree >>>' -AllMatches).Matches.Count -ne 1) { throw 'Reinstall duplicated the Show-Tree start marker.' }
          if (($text | Select-String -Pattern '# <<< Show-Tree <<<' -AllMatches).Matches.Count -ne 1) { throw 'Reinstall duplicated the Show-Tree end marker.' }
          if (($text | Select-String -Pattern 'show-tree-format\.nu' -AllMatches).Matches.Count -ne 1) { throw 'Reinstall duplicated or removed the showtree format import.' }
          if (($text | Select-String -Pattern 'show-tree-save\.nu' -AllMatches).Matches.Count -ne 1) { throw 'Reinstall duplicated or removed the save wrapper import.' }
          nu --config $nuConfig -c 'show-tree Show-Tree -d 0 | get 0.type | print'
