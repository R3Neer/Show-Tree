name: Test

on:
  push:
  pull_request:

jobs:
  nushell-structured-output:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Show-Tree
        uses: actions/checkout@v5
        with:
          path: Show-Tree

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '0.115.1'

      - name: Syntax-check Nushell modules and installer
        run: |
          nu --no-config-file -c 'nu-check --as-module Show-Tree/show-tree.nu | if not $in { exit 1 }'
          nu --no-config-file -c 'nu-check --as-module Show-Tree/show-tree-display.nu | if not $in { exit 1 }'
          nu --no-config-file -c 'nu-check Show-Tree/install-show-tree.nu | if not $in { exit 1 }'

      - name: Test native pipeline output
        run: nu Show-Tree/tests/Nushell.Structured.nu

      - name: Test direct rendering path
        run: nu --no-config-file -c 'use Show-Tree/show-tree.nu [main]; show-tree Show-Tree -d 0 | ignore'

      - name: Test direct REPL result through ans
        run: |
          python -m pip install pexpect
          python Show-Tree/tests/test_repl.py

  windows-installation:
    runs-on: windows-latest
    steps:
      - name: Check out Show-Tree
        uses: actions/checkout@v5
        with:
          path: Show-Tree

      - name: Set up Nushell
        uses: hustcer/setup-nu@v3
        with:
          version: '0.115.1'

      - name: Reject a corrupted vendored dependency
        shell: pwsh
        run: |
          $copy = Join-Path $env:RUNNER_TEMP 'Show-Tree-corrupt'
          Copy-Item -Recurse -Force ./Show-Tree $copy
          Add-Content -LiteralPath (Join-Path $copy 'vendor/R3CLI/powershell/resources.json') -Value ' '
          try {
              & (Join-Path $copy 'Install-ShowTree.ps1') -PowerShellOnly
              throw 'Corrupt dependency was unexpectedly accepted.'
          }
          catch {
              if ($_.Exception.Message -notmatch 'SHA256 verification') { throw }
          }

      - name: Seed a broken previous Show-Tree config block
        shell: pwsh
        run: |
          $nuConfig = (& nu --no-config-file -c 'print --no-newline $nu.config-path' | Out-String).Trim()
          New-Item -ItemType Directory -Path (Split-Path -Parent $nuConfig) -Force | Out-Null
          @'
          $env.SHOW_TREE_SENTINEL_BEFORE = 'before'
          # >>> Show-Tree >>>
          this old installer block is intentionally invalid [
          # <<< Show-Tree <<<
          $env.SHOW_TREE_SENTINEL_AFTER = 'after'
          '@ | Set-Content -LiteralPath $nuConfig -Encoding utf8NoBOM

          $nuPath = $nuConfig.Replace('\', '/')
          $checkCode = "if (open --raw '$nuPath' | nu-check) { exit 1 } else { exit 0 }"
          nu --no-config-file -c $checkCode

      - name: Repair and install through the Nushell installer
        shell: pwsh
        run: nu --no-config-file ./Show-Tree/install-show-tree.nu

      - name: Validate repaired config, backup and Nushell command
        shell: pwsh
        run: |
          $nuConfig = (& nu --no-config-file -c 'print --no-newline $nu.config-path' | Out-String).Trim()
          $text = Get-Content -LiteralPath $nuConfig -Raw
          if (($text | Select-String -Pattern '# >>> Show-Tree >>>' -AllMatches).Matches.Count -ne 1) { throw 'Expected one Show-Tree start marker.' }
          if (($text | Select-String -Pattern '# <<< Show-Tree <<<' -AllMatches).Matches.Count -ne 1) { throw 'Expected one Show-Tree end marker.' }
          if ($text.IndexOf('SHOW_TREE_SENTINEL_BEFORE') -gt $text.IndexOf('# >>> Show-Tree >>>')) { throw 'Installer moved the Show-Tree block ahead of preceding config.' }
          if ($text.IndexOf('SHOW_TREE_SENTINEL_AFTER') -lt $text.IndexOf('# <<< Show-Tree <<<')) { throw 'Installer moved the Show-Tree block behind following config.' }

          $backup = $nuConfig + '.show-tree.bak'
          if (-not (Test-Path -LiteralPath $backup)) { throw 'Nushell config backup was not created.' }
          if ((Get-Content -LiteralPath $backup -Raw) -notmatch 'intentionally invalid') { throw 'Backup does not contain the pre-repair config.' }

          $validationCode = @'
          if $env.SHOW_TREE_SENTINEL_BEFORE != 'before' or $env.SHOW_TREE_SENTINEL_AFTER != 'after' {
              error make { msg: 'surrounding config did not load' }
          }
          show-tree Show-Tree -d 0 | get 0.type | print
          '@
          nu --config $nuConfig -c $validationCode

      - name: Install PowerShell integration
        shell: pwsh
        run: ./Show-Tree/Install-ShowTree.ps1 -PowerShellOnly

      - name: Validate PowerShell profile import
        shell: pwsh
        run: pwsh -Command 'Show-Tree Show-Tree -MaxDepth 0'

      - name: Reinstall both integrations idempotently
        shell: pwsh
        run: |
          ./Show-Tree/Install-ShowTree.ps1
          $nuConfig = (& nu --no-config-file -c 'print --no-newline $nu.config-path' | Out-String).Trim()
          $text = Get-Content -LiteralPath $nuConfig -Raw
          if (($text | Select-String -Pattern '# >>> Show-Tree >>>' -AllMatches).Matches.Count -ne 1) { throw 'Reinstall duplicated the Show-Tree start marker.' }
          if (($text | Select-String -Pattern '# <<< Show-Tree <<<' -AllMatches).Matches.Count -ne 1) { throw 'Reinstall duplicated the Show-Tree end marker.' }
          nu --config $nuConfig -c 'show-tree Show-Tree -d 0 | get 0.type | print'
